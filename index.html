<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Academic Library</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f4f4;
}

/* Navbar */
nav{
    background:#6a5acd;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.nav-left a, .nav-right a{
    color:white;
    text-decoration:none;
    margin-right:20px;
    font-weight:bold;
    cursor:pointer;
}

.nav-left a:hover, .nav-right a:hover{
    text-decoration:underline;
}

/* Section */
section{
    display:none;
    padding:40px;
    max-width:900px;
    margin:40px auto;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
.active{
    display:block;
}

/* Form */
input, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    border-radius:5px;
    border:1px solid #ccc;
}
button{
    padding:10px 20px;
    background:#6a5acd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}
button:hover{
    background:#483d8b;
}

h1{
    color:#6a5acd;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav>
    <div class="nav-left">
        <a onclick="showSection('home')">Beranda</a>
        <a onclick="showSection('koleksi')">Koleksi</a>
        <a onclick="showSection('layanan')">Layanan</a>
        <a onclick="showSection('aboutme')">About Me</a>
        <a onclick="showSection('aboutadmin')">About Admin</a>
        <a onclick="showSection('contact')">Contact Us</a>
    </div>
    <div class="nav-right">
        <a onclick="showSection('login')">Login</a>
    </div>
</nav>

<!-- BERANDA -->
<section id="home" class="active">
    <h1>Selamat Datang di Prime Academic Library</h1>
    <p>Perpustakaan akademik modern untuk mendukung pembelajaran dan penelitian.</p>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>Contact Us</h2>
    <input type="text" id="nama" placeholder="Nama">
    <input type="email" id="email" placeholder="Email">
    <textarea id="pesan" rows="5" placeholder="Pesan"></textarea>
    <button type="button" onclick="kirimWA()">Kirim ke WhatsApp</button>
</section>

<!-- LOGIN -->
<section id="login">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button type="button" onclick="prosesLogin()">Login</button>
    <p>Belum punya akun?
        <span style="color:blue;cursor:pointer;" onclick="showSection('register')">
        Daftar di sini
        </span>
    </p>
</section>

<!-- REGISTER -->
<section id="register">
    <h2>Daftar Akun</h2>
    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="lastName" placeholder="Last Name">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="text" id="nohp" placeholder="No HP">
    <input type="password" id="regPassword" placeholder="Password">
    <button type="button" onclick="prosesDaftar()">Daftar</button>
</section>

<script>
function showSection(id){
    document.querySelectorAll("section").forEach(sec=>sec.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* WHATSAPP */
function kirimWA(){
    var nama=document.getElementById("nama").value;
    var email=document.getElementById("email").value;
    var pesan=document.getElementById("pesan").value;

    if(nama===""||email===""||pesan===""){
        alert("Harap isi semua data terlebih dahulu!");
        return;
    }

    var nomorWA="6281375400765";
    var url="https://wa.me/"+nomorWA+
    "?text=Halo, saya "+encodeURIComponent(nama)+
    "%0AEmail: "+encodeURIComponent(email)+
    "%0APesan: "+encodeURIComponent(pesan);

    window.open(url,"_blank");
}

/* LOGIN */
function prosesLogin(){
    var email=document.getElementById("loginEmail").value;
    var password=document.getElementById("loginPassword").value;

    if(email===""||password===""){
        alert("Email dan Password wajib diisi!");
        return;
    }

    alert("Login berhasil!");
    showSection("home");
}

/* REGISTER */
function prosesDaftar(){
    var first=document.getElementById("firstName").value;
    var last=document.getElementById("lastName").value;
    var email=document.getElementById("regEmail").value;
    var hp=document.getElementById("nohp").value;
    var pass=document.getElementById("regPassword").value;

    if(first===""||last===""||email===""||hp===""||pass===""){
        alert("Semua data wajib diisi!");
        return;
    }

    alert("Pendaftaran berhasil! Silakan login.");
    showSection("login");
}
</script>

</body>
</html>
