<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perpustakaan Nopita</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background-color: #f4f4f4;
}

/* Navbar */
nav {
    background-color: #6a5acd;
    padding: 15px;
    text-align: center;
}

nav a {
    color: white;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
    cursor: pointer;
}

nav a:hover {
    text-decoration: underline;
}

/* Section */
section {
    display: none;
    padding: 40px;
    max-width: 900px;
    margin: auto;
    background: white;
    margin-top: 30px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.active {
    display: block;
}

/* Form */
input, textarea {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    margin-bottom: 15px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    padding: 10px 20px;
    background-color: #6a5acd;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #483d8b;
}

/* Beranda styling besar */
h1 {
    font-size: 32px;
}
iframe {
    margin-top: 15px;
}
</style>
</head>

<body>

<nav>
    <a onclick="showSection('login')">Login</a>
    <a onclick="showSection('register')">Daftar</a>
    <a onclick="showSection('home')">Beranda</a>
    <a onclick="showSection('contact')">Contact Us</a>
</nav>

<!-- LOGIN -->
<section id="login" class="active">
    <h2>Login</h2>
    <input type="email" placeholder="Email">
    <input type="password" placeholder="Password">
    <button type="button" onclick="showSection('home')">Login</button>
</section>

<!-- DAFTAR -->
<section id="register">
    <h2>Daftar Akun</h2>
    <input type="text" placeholder="First Name">
    <input type="text" placeholder="Last Name">
    <input type="email" placeholder="Email">
    <input type="text" placeholder="No HP">
    <input type="password" placeholder="Password">
    <button type="button" onclick="showSection('login')">Daftar</button>
</section>

<!-- BERANDA (ISI ASLI DIKEMBALIKAN) -->
<section id="home">
    <h1>Selamat Datang di Perpustakaan Nopita</h1>
    <h2>Tentang Saya</h2>
    <p><strong>Nama:</strong> Nopita Laoli</p>
    <p><strong>NIM:</strong> 230709013</p>
    <p><strong>Jurusan:</strong> Perpustakaan dan Sains Informasi</p>

    <h3>Kenali Lebih Jauh Tentang Saya</h3>
    <p>
        <a href="https://www.instagram.com/invites/contact/?utm_source=ig_contact_invite&utm_medium=copy_link&utm_content=h49jwdt" target="_blank">
            Instagram
        </a>
    </p>

    <p>
        <a href="https://drive.google.com/file/d/1nWRf5GGhXtakvI44KvlGuE7v0zw2-ip_/view?usp=drive_link" target="_blank">
            Curriculum Vitae
        </a>
    </p>

    <h3>Teknik Membaca Cepat</h3>
    <iframe width="100%" height="400"
        src="https://www.youtube.com/embed/Dji6ApR56tk"
        frameborder="0" allowfullscreen>
    </iframe>
</section>

<!-- CONTACT -->
<section id="contact">
    <h2>Contact Us</h2>
    <input type="text" placeholder="Nama">
    <input type="email" placeholder="Email">
    <textarea rows="5" placeholder="Pesan"></textarea>
    <button type="button" onclick="alert('Pesan berhasil dikirim!')">Kirim</button>
</section>

<script>
function showSection(id) {
    document.querySelectorAll("section").forEach(sec => {
        sec.classList.remove("active");
    });
    document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
