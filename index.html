<!DOCTYPE html>
<html>
<head>
    <title>Perpustakaan Nopita</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        nav {
            margin-bottom: 20px;
        }

        nav button {
            margin: 5px;
        }
    </style>

    <script>
        function showLogin() {
            document.getElementById("login").style.display = "block";
            document.getElementById("register").style.display = "none";
            document.getElementById("home").style.display = "none";
        }

        function showRegister() {
            document.getElementById("login").style.display = "none";
            document.getElementById("register").style.display = "block";
            document.getElementById("home").style.display = "none";
        }

        function register() {
            var user = document.getElementById("regUser").value;
            var pass = document.getElementById("regPass").value;

            if(user === "" || pass === "") {
                alert("Isi semua data!");
                return;
            }

            localStorage.setItem("user", user);
            localStorage.setItem("pass", pass);

            alert("Pendaftaran berhasil! Silakan login.");
            showLogin();
        }

        function login() {
            var user = document.getElementById("loginUser").value;
            var pass = document.getElementById("loginPass").value;

            var savedUser = localStorage.getItem("user");
            var savedPass = localStorage.getItem("pass");

            if(user === savedUser && pass === savedPass) {
                document.getElementById("login").style.display = "none";
                document.getElementById("home").style.display = "block";
            } else {
                alert("Username atau password salah!");
            }
        }

        function logout() {
            showLogin();
        }
    </script>
</head>

<body onload="showLogin()">

<!-- LOGIN -->
<div id="login">
    <h2>Login Perpustakaan Nopita</h2>

    <input type="text" id="loginUser" placeholder="Username"><br>
    <input type="password" id="loginPass" placeholder="Password"><br>
    <button onclick="login()">Login</button>

    <p>Belum punya akun?</p>
    <button onclick="showRegister()">Daftar di sini</button>
</div>

<!-- REGISTER -->
<div id="register" class="hidden">
    <h2>Daftar Akun Baru</h2>

    <input type="text" id="regUser" placeholder="Username"><br>
    <input type="password" id="regPass" placeholder="Password"><br>
    <button onclick="register()">Daftar</button>

    <p>Sudah punya akun?</p>
    <button onclick="showLogin()">Login di sini</button>
</div>

<!-- HOME -->
<div id="home" class="hidden">
    <nav>
        <button onclick="logout()">Logout</button>
    </nav>
