<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Academic Library</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da') no-repeat center center/cover;
min-height:100vh;
transition:0.5s;
}

.overlay{
background:rgba(255,255,255,0.75);
min-height:100vh;
}

/* NAVBAR */

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
background:#1e2a38;
flex-wrap:nowrap;
overflow-x:auto;
}

nav .left, nav .right{
display:flex;
flex-wrap:nowrap;
}

nav a{
color:white;
text-decoration:none;
margin:5px 12px;
font-weight:600;
font-size:14px;
cursor:pointer;
white-space:nowrap;
}

nav a:hover{
color:#ffd700;
}

/* CONTENT */

.content{
display:none;
padding:60px 30px;
max-width:900px;
margin:40px auto;
background:rgba(255,255,255,0.92);
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

.active{
display:block;
}

h1,h2{
text-align:center;
margin-bottom:20px;
}

h3{
margin-top:20px;
margin-bottom:10px;
}

p{
line-height:1.6;
margin-bottom:10px;
}

ul{
padding-left:20px;
margin-bottom:10px;
}

ul li{
margin:8px 0;
}

input,textarea{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

button{
padding:10px 18px;
border:none;
background:#1e2a38;
color:white;
border-radius:6px;
cursor:pointer;
}

button:hover{
background:#2f4054;
}

.link{
display:block;
margin:8px 0;
font-weight:bold;
text-decoration:none;
color:#1e2a38;
}

.slogan{
text-align:center;
font-style:italic;
font-size:18px;
margin-top:10px;
color:#2f4054;
}

#registerForm{
display:none;
margin-top:20px;
padding-top:10px;
border-top:1px solid #ccc;
}

/* TAMBAHAN PAMERAN */

.pameran{
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
margin-top:20px;
}

.pameran div{
text-align:center;
cursor:pointer;
}

.pameran img{
width:120px;
border-radius:8px;
transition:0.3s;
}

.pameran img:hover{
transform:scale(1.1);
}

/* POPUP */

#popup{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
justify-content:center;
align-items:center;
}

.popup-box{
background:white;
padding:20px;
border-radius:10px;
width:300px;
text-align:center;
}

</style>

<script>

function showSection(id){

var sections=document.querySelectorAll('.content');
sections.forEach(section=>section.classList.remove('active'));

document.getElementById(id).classList.add('active');

if(id==="beranda"){
document.body.style.background="url('https://images.unsplash.com/photo-1521587760476-6c12a4b040da') no-repeat center center/cover";
}

if(id==="profil"){
document.body.style.background="url('https://images.unsplash.com/photo-1507842217343-583bb7270b66') no-repeat center center/cover";
}

if(id==="koleksi"){
document.body.style.background="url('https://images.unsplash.com/photo-1512820790803-83ca734da794') no-repeat center center/cover";
}

if(id==="layanan"){
document.body.style.background="url('https://images.unsplash.com/photo-1497633762265-9d179a990aa6') no-repeat center center/cover";
}

if(id==="event"){
document.body.style.background="url('https://images.unsplash.com/photo-1505373877841-8d25f7d46678') no-repeat center center/cover";
}

if(id==="forum"){
document.body.style.background="url('https://images.unsplash.com/photo-1519389950473-47ba0277781c') no-repeat center center/cover";
}

if(id==="about"){
document.body.style.background="url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570') no-repeat center center/cover";
}

if(id==="contact"){
document.body.style.background="url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f') no-repeat center center/cover";
}

if(id==="login"){
document.body.style.background="url('https://images.unsplash.com/photo-1497215842964-222b430dc094') no-repeat center center/cover";
}

}

function bukaRegister(){
document.getElementById("registerForm").style.display="block";
}

function kirimWA(){
var nama=document.getElementById("namaForum").value;
var pesan=document.getElementById("pesanForum").value;
var url="https://wa.me/?text=Halo saya "+nama+"%0A%0ADiskusi:%0A"+pesan;
window.open(url,"_blank");
}

/* POPUP */

function openPopup(judul, deskripsi){
document.getElementById("popup").style.display="flex";
document.getElementById("popupTitle").innerText=judul;
document.getElementById("popupDesc").innerText=deskripsi;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}

</script>

</head>

<body>

<div class="overlay">

<nav>
<div class="left">
<a onclick="showSection('beranda')">Beranda</a>
<a onclick="showSection('profil')">Profil Perpustakaan</a>
<a onclick="showSection('koleksi')">Koleksi</a>
<a onclick="showSection('layanan')">Layanan</a>
<a onclick="showSection('event')">Event</a>
<a onclick="showSection('forum')">Forum</a>
<a onclick="showSection('about')">About Me</a>
<a onclick="showSection('contact')">Contact Us</a>
</div>

<div class="right">
<a onclick="showSection('login')">Login</a>
</div>
</nav>

<div id="beranda" class="content active">

<h1>Selamat Datang di Prime Academic Library</h1>

<p class="slogan">
"Membuka akses pengetahuan, mendukung riset, dan menumbuhkan budaya literasi akademik."
</p>

<h2>Pameran Buku</h2>

<div class="pameran">

<div
